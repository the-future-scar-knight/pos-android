# Project-wide Gradle settings.
# This machine has only ~4 GB RAM and NO Windows page file, so the build must
# fit in a single JVM. We therefore:
#  - run Kotlin compilation IN-PROCESS (no separate Kotlin daemon = one JVM, not two)
#  - use SerialGC (G1 reserves much more native memory than we can spare)
#  - cap metaspace generously (the OOM crashes were "failed to commit metaspace"
#    during Kotlin/KSP class loading) but keep the heap modest.
# Durable fix is to enable a system-managed page file; these flags just let the
# build squeeze into available RAM in the meantime.
#
# Heap is 1536m (was 768m): plain compile/test fits in 768m, but minifyReleaseWithR8
# OOMs there — R8 has to chew through every class in material-icons-extended, which
# is huge. 1536m is the smallest heap that gets R8 through on this 4 GB host.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1

# Run R8 in compat mode rather than full mode: less aggressive optimization but a
# materially smaller memory footprint, which is what lets it finish on this host.
android.enableR8.fullMode=false

# Compile Kotlin inside the Gradle JVM instead of forking a second daemon,
# so we never hold two JVMs in memory at the same time.
kotlin.compiler.execution.strategy=in-process

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
