# Project-wide Gradle settings.
#
# This host is an 8 GB / dual-core i5-6300U laptop with a 15 GB system page file.
# Earlier this file was tuned for a 4 GB, no-page-file machine (tiny heap, SerialGC,
# no parallelism) — that throttling is no longer needed now the page file exists, so
# these settings are relaxed for speed while still fitting the modest RAM:
#  - Heap 2560m: room for Kotlin + KSP + R8 in one JVM without GC thrashing (R8 over
#    material-icons-extended was the old OOM; the page file now backs any overflow).
#  - Default G1 GC (faster than SerialGC); its extra native memory is fine with a page file.
#  - 2 workers / parallel: the CPU has 2 physical cores.
#  - Kotlin still compiles IN-PROCESS (inside the warm Gradle daemon) rather than forking a
#    separate Kotlin daemon — on this host the standalone Kotlin daemon fails to connect
#    (firewall) and falls back to a glacial no-daemon compile, so in-process is faster.
# If builds OOM, drop -Xmx back toward 1536m.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=192m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=2
org.gradle.daemon=true

# Run R8 in compat mode rather than full mode: less aggressive optimization but a
# materially smaller memory footprint, which is what lets it finish on this host.
android.enableR8.fullMode=false

# Compile Kotlin inside the Gradle JVM instead of forking a second daemon (see note above).
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
